spring:
  datasource:
    url: jdbc:h2:mem:riskshield_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    listener:
      auto-startup: false

riskshield:
  ml-service:
    url: http://localhost:8000
    timeout-ms: 2000
  policy:
    default-block-threshold: 0.85
    default-review-threshold: 0.60
  razorpay:
    key-id: rzp_test_mock_key_id
    key-secret: rzp_test_mock_key_secret
    webhook-secret: rzp_test_mock_webhook_secret
